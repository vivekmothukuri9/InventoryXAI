<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portal selection for Dealers, Shopkeepers, and Customers">
    <title>Select Your Role - Portal</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <div class="lang-selector">
        <span class="globe-icon">🌐</span>
        <select id="languageSelect">
            <option value="en">English</option>
            <option value="hi">हिन्दी</option>
            <option value="te">తెలుగు</option>
            <option value="ta">தமிழ்</option>
            <option value="kn">ಕನ್ನಡ</option>
            <option value="ml">മലയാളം</option>
            <option value="mr">मराठी</option>
        </select>
    </div>

    <div class="container">
        <header class="header">
            <h1 data-i18n="title">Select Your Role</h1>
            <p data-i18n="subtitle">Choose your designated portal to continue</p>
        </header>
        
        <div class="cards-wrapper">
            <!-- Dealer Card -->
            <div class="card">
                <div class="icon-wrapper dealer-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                </div>
                <h2 data-i18n="dealerTitle">Dealer</h2>
                <p data-i18n="dealerDesc">Manage your distribution network, track bulk orders, and analyze regional sales analytics.</p>
                <button class="btn btn-dealer" data-i18n="dealerBtn" onclick="window.location.href='dealer-auth.html'">Login as Dealer</button>
            </div>

            <!-- Shopkeeper Card -->
            <div class="card">
                <div class="icon-wrapper shopkeeper-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
                </div>
                <h2 data-i18n="shopkeeperTitle">Shopkeeper</h2>
                <p data-i18n="shopkeeperDesc">Manage your local inventory, track daily retail sales, and easily re-stock from dealers.</p>
                <button class="btn btn-shopkeeper" data-i18n="shopkeeperBtn">Login as Shopkeeper</button>
            </div>

        </div>
    </div>
</body>
</html>
